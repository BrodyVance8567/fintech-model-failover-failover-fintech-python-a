[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-model-failover"
version = "0.1.0"
description = "Route payment-risk analysis across model vendors while keeping sensitive actions deterministic."
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40,<2",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
